<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/filex.js"></script>
  <style>
    .video-wrap {
      max-width: 100%;
      margin: 16px auto;
      text-align: center;
    }
    .video-wrap video {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .media-dl {
      margin: 12px auto;
      text-align: center;
    }
    .media-dl a {
      display: inline-block;
      padding: 8px 20px;
      background: #1a1a2e;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .media-dl a:hover { background: #2a2a50; }
  </style>
</head>
<body>
  {{toolbar_html}}
  <div class="video-wrap">
    <video src="{{video_src}}" controls autoplay></video>
    <p class="media-dl"><a href="{{video_dl}}">⬇ Descargar video</a></p>
  </div>
</body>
</html>
