<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/filex.js"></script>
  <style>
    .audio-wrap {
      max-width: 100%;
      margin: 24px auto;
      text-align: center;
    }
    .audio-wrap audio {
      width: 100%;
      border-radius: 4px;
    }
    .media-dl {
      margin: 12px auto;
      text-align: center;
    }
    .media-dl a {
      display: inline-block;
      padding: 8px 20px;
      background: #1a1a2e;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .media-dl a:hover { background: #2a2a50; }
  </style>
</head>
<body>
  {{toolbar_html}}
  <div class="audio-wrap">
    <audio src="{{audio_src}}" controls autoplay preload="metadata"></audio>
    <p class="media-dl"><a href="{{audio_dl}}">⬇ Descargar audio</a></p>
  </div>
</body>
</html>
